name: CI

# Cost policy: every job runs on ubuntu-latest (GitHub-hosted, no multiplier),
# every job is time-bounded, superseded runs are cancelled, and docs-only
# pushes do not trigger the pipeline. See docs/github-actions-cost-control.md.
on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [ main, develop ]

# Least privilege: no job needs write access except through explicit grants.
permissions:
  contents: read

# Cancelling superseded runs is the single biggest minute saver on busy branches.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.10"

jobs:
  cost-guard:
    name: Cost Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Reject billable or unbounded workflow configuration
      run: ruby .github/scripts/cost-guard.rb

    - name: Warn when the repository is not public
      if: github.event.repository.private
      run: |
        echo "::warning::This repository is private. Standard runners are billable beyond the free allowance; confirm the account spending limit is \$0. See docs/github-actions-cost-control.md."

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [cost-guard]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: socks5_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: Formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Not gofmt-formatted:"
          echo "$unformatted"
          exit 1
        fi

    # `go test` already compiles benchmark harnesses, so the separate
    # benchmark build/compile steps were redundant paid work.
    - name: Run tests (including PostgreSQL integration)
      run: go test -race -coverprofile=coverage.out ./...
      env:
        TEST_DB_HOST: localhost
        TEST_DB_PORT: "5432"
        TEST_DB_USER: test_user
        TEST_DB_PASSWORD: test_password
        TEST_DB_NAME: socks5_test
        TEST_DB_SSLMODE: disable

    # Codecov is optional and never allowed to fail the build. Upload only on
    # pushes so pull requests generate no external calls.
    - name: Upload coverage to Codecov
      if: github.event_name == 'push'
      continue-on-error: true
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.out
        flags: unittests
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [cost-guard]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0

  # Cross-compilation is done on one runner instead of a 5-runner matrix:
  # same coverage, one job startup, no artifact storage.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [cost-guard, test, lint]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Cross-compile release targets
      env:
        CGO_ENABLED: "0"
      run: |
        set -euo pipefail
        mkdir -p bin
        for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
          os="${target%/*}"
          arch="${target#*/}"
          ext=""
          if [ "$os" = "windows" ]; then ext=".exe"; fi

          GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-w -s" \
            -o "bin/proxy-$os-$arch$ext" ./cmd/proxy
          GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-w -s" \
            -o "bin/api-$os-$arch$ext" ./cmd/api
          echo "built $os/$arch"
        done

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [cost-guard]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    # Pinned versions: an unpinned install re-resolves (and can silently change)
    # on every run, which is both a supply-chain and a runtime-cost risk.
    - name: Install pinned scanners
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
        go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Run gosec security scanner
      run: gosec ./...

    - name: Run govulncheck
      run: govulncheck ./...
