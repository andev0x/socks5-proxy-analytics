name: Docker Build and Push

# Cost policy: pull requests build a single linux/amd64 image without QEMU or
# a registry push. Multi-arch builds and pushes happen only on main/tags.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: [ api, proxy ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # QEMU is only needed for the linux/arm64 build, which only runs off PRs.
    - name: Set up QEMU
      if: github.event_name != 'pull_request'
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
        flavor: |
          latest=auto

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./build/docker/Dockerfile.${{ matrix.service }}
        platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Separate cache scopes stop the api and proxy builds evicting each other.
        cache-from: type=gha,scope=${{ matrix.service }}
        cache-to: type=gha,mode=${{ github.event_name == 'pull_request' && 'min' || 'max' }},scope=${{ matrix.service }}

  # Runs in parallel with build-and-push: docker compose builds its own images,
  # so the previous `needs` dependency only serialized (doubled) the wall clock.
  integration-test:
    name: Integration Test with Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Docker Compose
      run: |
        docker compose -f deployments/docker-compose.yml up -d --build

    - name: Wait for services to be ready
      run: |
        echo "Waiting for database to be ready..."
        timeout 90 bash -c 'until docker compose -f deployments/docker-compose.yml exec -T db pg_isready -U socks5 -d socks5_analytics; do sleep 2; done'
        echo "Waiting for API to be ready..."
        timeout 90 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'
        echo "Waiting for metrics endpoint..."
        timeout 90 bash -c 'until curl -sf http://localhost:9090/metrics; do sleep 2; done'

    - name: Test API and metrics endpoints
      run: |
        curl -f http://localhost:8080/health
        curl -f http://localhost:8080/stats/traffic
        curl -f http://localhost:9090/metrics | grep socks5_proxy_connections_accepted_total

    - name: Test SOCKS5 proxying end to end
      run: |
        # The proxy resolves "api" in the Compose network, so this exercises DNS,
        # forwarding and the analytics pipeline rather than only a TCP port check.
        curl -f --proxy socks5h://127.0.0.1:1080 http://api:8080/health

    - name: Show logs on failure
      if: failure()
      run: |
        echo "=== API Logs ==="
        docker compose -f deployments/docker-compose.yml logs api
        echo "=== Proxy Logs ==="
        docker compose -f deployments/docker-compose.yml logs proxy
        echo "=== Database Logs ==="
        docker compose -f deployments/docker-compose.yml logs db

    - name: Cleanup
      if: always()
      run: |
        docker compose -f deployments/docker-compose.yml down -v
