name: Bug report
description: Report a defect or unexpected behavior.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as
        possible. For security issues, see SECURITY.md and do not file a public issue.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Start the proxy with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Git commit, tag, or release.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, PostgreSQL version, deployment method.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / metrics
      description: Paste logs or metric excerpts (redact secrets).
      render: shell
    validations:
      required: false